name: Issue1240 Bash home full formatting v1
on:
  push:
    branches: [codex/issue1240-fullfmt-v1-20261021]
permissions:
  contents: read
concurrency:
  group: issue1240-fullfmt-v1
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact method commit
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: method
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Check out exact public source
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: CorbanuCore/CorbanuTerminal
          ref: d7684fae8fc74a90ecb8b558c1144ec0c44d04ee
          path: subject
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Run admitted format-only controller
        timeout-minutes: 30
        run: python3 method/controller.py
      - name: Retain audited raw formatter and source evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: issue1240-fullfmt-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue1240-format-evidence/
          if-no-files-found: error
          retention-days: 14
