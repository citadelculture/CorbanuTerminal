name: Issue1094 v4 original binary verification

on:
  push:
    branches: [validation/issue1094-binary-projection-v4-20261022]

permissions:
  contents: read
  actions: read

concurrency:
  group: issue1094-v4-original-binary-verification
  cancel-in-progress: false

jobs:
  verify-original-binaries:
    if: github.repository == 'citadelculture/CorbanuTerminal'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout binary verifier only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: method-checkout
          persist-credentials: false
          sparse-checkout: .github/issue1094-binary-projection
      - name: Stream-verify the two existing public binary archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 method-checkout/.github/issue1094-binary-projection/project_artifacts.py \
            --work "$RUNNER_TEMP/issue1094-original-archive-copies" \
            --output "$GITHUB_WORKSPACE/issue1094-original-binary-verification"
      - name: Preserve original archive and streamed ELF hash verification receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: issue1094-original39720100672-binary-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue1094-original-binary-verification/
          if-no-files-found: error
          retention-days: 14
