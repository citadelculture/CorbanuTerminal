name: credential boundary canary

on:
  pull_request:
    paths:
      - ".github/workflows/credential-boundary-canary.yml"
      - "scripts/security-credential-canary"
      - "scripts/security_credential_canary.py"
      - "scripts/test_security_credential_canary.py"
      - "codex-rs/security-policy/**"
      - "codex-rs/vault/**"
      - "codex-rs/network-proxy/**"
      - "codex-rs/core/**"
      - "codex-rs/cli/**"
  push:
    paths:
      - ".github/workflows/credential-boundary-canary.yml"
      - "scripts/security-credential-canary"
      - "scripts/security_credential_canary.py"
      - "scripts/test_security_credential_canary.py"
      - "codex-rs/security-policy/**"
      - "codex-rs/vault/**"
      - "codex-rs/network-proxy/**"
      - "codex-rs/core/**"
      - "codex-rs/cli/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-boundary-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-canary:
    name: ${{ matrix.name }} credential canary
    # Control-only exclusion: this exact fork push runs the tmux diagnostic only.
    if: >-
      ${{
        github.event_name != 'push' ||
        github.repository != 'citadelculture/CorbanuTerminal' ||
        github.ref != 'refs/heads/codex/pr1122-tmux-push-v2-20261020'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            python: python3
            candidate: codex-rs/target/debug/corbanu
          - name: macOS
            runner: macos-15
            python: python3
            candidate: codex-rs/target/debug/corbanu
          - name: Windows
            runner: windows-2022
            python: python
            candidate: codex-rs/target/debug/corbanu.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            pkg-config
      - name: Test harness fail-closed behavior
        shell: bash
        run: ${{ matrix.python }} -m unittest scripts.test_security_credential_canary
      - name: Run PF-13 credential qualification
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python }} scripts/security-credential-canary \
            --candidate "${{ matrix.candidate }}" \
            --output "credential-canary-artifacts/${{ runner.os }}"
      - name: Upload credential qualification
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: credential-boundary-canary-${{ runner.os }}-${{ github.sha }}
          path: credential-canary-artifacts/${{ runner.os }}/
          if-no-files-found: warn
