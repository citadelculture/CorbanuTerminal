name: corbanu-terminal-ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  deploy-smoke:
    name: Build and package Corbanu Terminal
    # Control-only exclusion: this exact fork push runs the tmux diagnostic only.
    if: >-
      ${{
        github.event_name != 'push' ||
        github.repository != 'citadelculture/CorbanuTerminal' ||
        github.ref != 'refs/heads/codex/pr1122-tmux-push-v2-20261020'
      }}
    # Match the oldest supported GNU/Linux release baseline (glibc 2.35).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      - name: Install Linux package prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libcap-dev

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Validate installer and package helper
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install/install.sh
          bash -n scripts/install/build_macos_dmg.sh
          python3 scripts/install/test_corbanu_release_contract.py
          python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Validate product plan and sprint lifecycles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s docs/plans/tests -p 'test_*.py'
          python3 docs/plans/check.py
          python3 -m unittest discover -s docs/sprints/tests -p 'test_*.py'
          python3 docs/sprints/check.py

      - name: Validate portable agent skills
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_check_portable_skills
          python3 scripts/check_portable_skills.py

      - name: Check price catalogue calendars
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_check_price_calendars
          # Warning only here; nightly-ci fails 30 days before a list runs out.
          python3 scripts/check_price_calendars.py --warn-only

      - name: Build Corbanu Terminal binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path codex-rs/Cargo.toml \
            --profile dev-small \
            --bin corbanu \
            --bin corbanu-acp \
            --bin corbanu-walletd \
            --bin codex-code-mode-host \
            --bin bwrap
          codex-rs/target/dev-small/corbanu --version
          codex-rs/target/dev-small/corbanu-walletd --help >/dev/null

      - name: Test GLM 5.3 runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --profile dev-small --package codex-core zai_
          cargo test --manifest-path codex-rs/Cargo.toml --profile dev-small --package codex-core \
            ambient_required_low_reasoning_is_enabled_without_duplicate_scalar_control
          cargo test --manifest-path codex-rs/Cargo.toml --profile dev-small --package codex-core \
            scheduled_billing_renders_weekday_and_legacy_daily_contracts
          cargo test --manifest-path codex-rs/Cargo.toml --profile dev-small --package codex-model-provider-info \
            zai_glm_5_3_resolves_only_on_the_direct_zai_route
          cargo test --manifest-path codex-rs/Cargo.toml --profile dev-small --package codex-models-manager \
            bundled_models_json_contains_ambient_and_zai_models

      - name: Compile codex-api test targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check \
            --manifest-path codex-rs/Cargo.toml \
            --profile dev-small \
            --tests \
            --package codex-api

      - name: Build and smoke-test Corbanu Terminal package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/build_codex_package.py \
            --target x86_64-unknown-linux-gnu \
            --variant corbanu \
            --entrypoint-bin codex-rs/target/dev-small/corbanu \
            --extra-bin "corbanu-debug=codex-rs/target/dev-small/corbanu" \
            --extra-bin "corbanu-acp=codex-rs/target/dev-small/corbanu-acp" \
            --extra-bin "corbanu-walletd=codex-rs/target/dev-small/corbanu-walletd" \
            --code-mode-host-bin codex-rs/target/dev-small/codex-code-mode-host \
            --bwrap-bin codex-rs/target/dev-small/bwrap \
            --cargo-profile dev-small \
            --package-dir "${RUNNER_TEMP}/corbanu-terminal-package-x86_64-unknown-linux-gnu" \
            --archive-output "dist/corbanu-terminal-package-x86_64-unknown-linux-gnu.tar.gz" \
            --force

          package_dir="${RUNNER_TEMP}/corbanu-terminal-smoke"
          mkdir -p "$package_dir"
          tar -xzf "dist/corbanu-terminal-package-x86_64-unknown-linux-gnu.tar.gz" -C "$package_dir"
          "$package_dir/bin/corbanu" --version
          "$package_dir/bin/corbanu" telegram --help >/dev/null
          help_output="$("$package_dir/bin/corbanu" exec --help 2>&1)"
          grep -F '~/.corbanu/config.toml' <<<"$help_output"
          grep -F '$CORBANU_HOME/config.toml' <<<"$help_output"
          ! grep -Eqi 'pfterminal|postfiat|PFTERMINAL' <<<"$help_output"
          test -x "$package_dir/bin/corbanu-acp"
          test -x "$package_dir/bin/corbanu-walletd"
          test ! -e "$package_dir/bin/pfterminal"
          test ! -e "$package_dir/bin/pfterminal-debug"
          test ! -e "$package_dir/bin/pfterminal-acp"
          test ! -e "$package_dir/bin/pfterminal-walletd"
          "$package_dir/bin/corbanu-walletd" --help >/dev/null
          wallet_home="${RUNNER_TEMP}/wallet-smoke-x86_64-unknown-linux-gnu"
          "$package_dir/bin/corbanu-walletd" --codex-home "$wallet_home" &
          walletd_pid=$!
          trap 'kill "$walletd_pid" 2>/dev/null || true; wait "$walletd_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            test -S "$wallet_home/wallet/run/walletd.sock" && break
            kill -0 "$walletd_pid" 2>/dev/null
            sleep 0.05
          done
          test -S "$wallet_home/wallet/run/walletd.sock"
          kill "$walletd_pid"
          wait "$walletd_pid" || true
          trap - EXIT
          ! find "$package_dir" -type f -o -type l | grep -E '/codex([^/-]*)(\.exe)?$'
          test -x "$package_dir/codex-path/rg"
          telegram_resources="$package_dir/codex-resources/telegram"
          test -x "$telegram_resources/setup-telegram.sh"
          bash -n "$telegram_resources/setup-telegram.sh"
          test -f "$telegram_resources/install-telegram-task.ps1"
          test -f "$telegram_resources/dist/AGENTS.md.template"
          test -f "$telegram_resources/dist/corbanu-terminal-telegram.service"
          test -f "$telegram_resources/dist/org.corbanu.terminal.telegram.plist"

      - name: Verify developer accounting cannot be packaged
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path codex-rs/Cargo.toml --profile dev-small \
            --bin corbanu --features codex-core/developer-accounting
          python3 -B scripts/test_build_codex_package.py \
            --feature-artifact codex-rs/target/dev-small/corbanu

      - name: Upload package smoke artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corbanu-terminal-package-linux-x64-smoke
          path: dist/corbanu-terminal-package-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
