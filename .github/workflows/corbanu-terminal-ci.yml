name: issue1573 classifier qualification
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: issue1573-qualification-nov01
  cancel-in-progress: false
jobs:
  qualified-red-green:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 25604fe1a559c2d1a014a8242712d1c73a6404d7
          fetch-depth: 3
          persist-credentials: false
          path: source
      - uses: ./source/.github/actions/setup-ci
      - name: Install existing Linux build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.103
      - name: Qualify frozen before-fix regression and full fixed classifier
        working-directory: source
        # setup-ci defines a general target; this step owns a fresh bounded target instead.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/issue1573-target
        run: |
          python3 - <<'PY'
          """Bounded qualification for accepted task8269, issue1573 item1; attempt1 of at most2."""
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import subprocess
          import tempfile
          import time
          import xml.etree.ElementTree as ET

          SOURCE = Path.cwd()
          CARGO = SOURCE / "codex-rs"
          TARGET = Path(os.environ["CARGO_TARGET_DIR"])
          EVIDENCE = Path(os.environ["RUNNER_TEMP"]) / "issue1573-evidence"
          EVIDENCE.mkdir(parents=True, exist_ok=True)
          GIB = 1024**3
          BASE = "1329ea58833c2bbef4fc19b4d60fb09bab52e188"
          RED = "c772c8d5dbd05fd090894c4f036b53e9727bfa1a"
          CANDIDATE = "25604fe1a559c2d1a014a8242712d1c73a6404d7"
          IMPLEMENTATION = "codex-rs/core/src/security/tainted_action.rs"
          TEST_FILE = "codex-rs/core/src/security/tainted_action_tests.rs"
          IMPLEMENTATION_FILES = [
              IMPLEMENTATION,
              "codex-rs/core/src/security/tainted_action/quoted.rs",
              "codex-rs/core/src/security/tainted_action/nested.rs",
              "codex-rs/core/src/security/tainted_action/named_shell.rs",
              "codex-rs/core/src/security/tainted_action/measure_tests.rs",
          ]
          DCO_IDENTITY = "citadelculture <209115483+citadelculture@users.noreply.github.com>"
          WRAPPER_HASH = "2376d36fae0943cbbf4a0caf58109b0dece03cb226983d1276216adc90d2447c"
          HASHES = {
              RED: {
                  "codex-rs/core/src/security/tainted_action.rs": "ffdd41b87e8984f12adcd01825bafc83fa05f7d3ebd2ea99a5d93397345acd5a",
                  "codex-rs/core/src/security/tainted_action/measure_tests.rs": "1e84e012b7a34d7be9d3b5ef8a86a3a887b19b4336692a0a68aba90f690c0b4f",
                  "codex-rs/core/src/security/tainted_action/named_shell.rs": "f927c3c8d5ca7354cbe924b1a6d41139fb9f4d55c6d15456bc99052feefe0a1c",
                  "codex-rs/core/src/security/tainted_action/nested.rs": "567119d4067ddefa85b7359d9f02f15c31b6ee317e91e61e572bd27ac1fddb2b",
                  "codex-rs/core/src/security/tainted_action/quoted.rs": "bd7eddd787205a7330c980206392c7d020174f0dfc5d9ddaa020a0e2ce0f2574",
                  "codex-rs/core/src/security/tainted_action_tests.rs": "816c105c7290dd72e9a9435321f9f49dd31dfdc89430ffd063857bd569afe0be",
              },
              CANDIDATE: {
                  "codex-rs/core/src/security/tainted_action.rs": "e2e3f98c773907988f47c1333f6626969595047c4e84f784ed7b4655214bf3ea",
                  "codex-rs/core/src/security/tainted_action/measure_tests.rs": "6c2677f8e60cfe97f646343f7acd34223e23387dc9edf9406592c2da847214a6",
                  "codex-rs/core/src/security/tainted_action/named_shell.rs": "0f832034d571500ee93a618c7ec5203a88a155f60a41a59dcec5725788c24e53",
                  "codex-rs/core/src/security/tainted_action/nested.rs": "89cb7bd6328c23a01c4a0520e4aa4b47cdc574c3731443194dd081dcdd579de0",
                  "codex-rs/core/src/security/tainted_action/quoted.rs": "f4f7bc6127921d323d09b25cb3d631b66f9b77324ac1f8a51a2bca1d782497e7",
                  "codex-rs/core/src/security/tainted_action_tests.rs": "816c105c7290dd72e9a9435321f9f49dd31dfdc89430ffd063857bd569afe0be",
              },
          }
          PREFIX = "security::tainted_action::"
          RED_NAME = PREFIX + "tests::issue_1573_zsh_equals_redirect_is_persistence"
          NEW_NAMES = {
              RED_NAME,
              PREFIX + "tests::issue_1573_zsh_equals_redirect_forms_are_protected",
              PREFIX + "tests::issue_1573_literal_equals_redirects_stay_ordinary",
              PREFIX + "tests::issue_1573_equals_redirect_respects_named_shell_execution",
              PREFIX + "tests::issue_1573_evaluated_equals_redirects_are_protected",
              PREFIX + "tests::issue_1573_evaluated_quotes_and_ordinary_data_stay_ordinary",
          }
          EXPECTED_IGNORED = {
              PREFIX + "named_shell::measure_tests::measure_classifier_corpus",
              PREFIX + "named_shell::measure_tests::dump_classifier_events",
          }
          ASSERTION = "issue1573: active zsh =mytool redirect must protect an executable write"
          COMMON_ARGV = [
              "just", "test", "-p", "codex-core", "--lib", "--locked",
              "--no-tests", "fail", "--retries", "0", "--test-threads", "1",
              "--success-output", "immediate", "--failure-output", "immediate",
              "--color", "never",
          ]
          STARTED = time.monotonic()
          RESULT = {
              "issueUrl": "https://github.com/CorbanuCore/CorbanuTerminal/issues/1573",
              "taskId": "task_8269cfd54b47ca1be10ec58c8d71c801", "pft": 400,
              "campaignAttempt": 1, "maximumTaskCampaigns": 2,
              "workflowRunId": os.environ.get("GITHUB_RUN_ID"),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflowSha": os.environ.get("GITHUB_SHA"),
              "candidate": CANDIDATE, "beforeFix": RED, "base": BASE,
              "commonArgv": COMMON_ARGV, "cwd": str(CARGO), "phases": [],
              "qualified": False, "restoredCandidate": False,
              "bounds": {"initialFreeGiB": 30, "earlyStopFreeGiB": 12,
                         "hardReserveGiB": 8, "processGroupRssGiB": 12,
                         "logBytesPerPhase": 50 * 1024**2, "wholeCampaignSeconds": 75 * 60,
                         "redSeconds": 45 * 60, "greenSeconds": 15 * 60},
              "resourceConfiguration": {"CARGO_BUILD_JOBS": "1", "CARGO_INCREMENTAL": "0"},
              "sandboxControls": {name: os.environ.get(name) for name in
                                  ("CODEX_SANDBOX", "CODEX_SANDBOX_NETWORK_DISABLED")},
              "qualificationScope": "Issue1573 item1 red regression and all ordinary security::tainted_action:: library tests; two explicitly ignored external-corpus measurements are inventoried, not run or passed; no whole-core/platform/product-release claim.",
          }


          def save():
              (EVIDENCE / "result.json").write_text(json.dumps(RESULT, indent=2) + "\n")


          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()


          def git(*args):
              return subprocess.check_output(["git", *args], cwd=SOURCE, text=True).strip()


          def snapshot(label, expected):
              assert git("rev-parse", "HEAD") == expected
              assert not git("status", "--porcelain", "--untracked-files=no"), "tracked source changed"
              for path, expected_hash in HASHES[expected].items():
                  assert digest(SOURCE / path) == expected_hash, f"source hash mismatch: {path}"
              assert digest(SOURCE / "scripts/isolated_rust_tests.py") == WRAPPER_HASH, "isolation wrapper changed"
              pins = {path: digest(SOURCE / path) for path in [
                  *IMPLEMENTATION_FILES, TEST_FILE, "codex-rs/Cargo.toml",
                  "codex-rs/Cargo.lock", "codex-rs/rust-toolchain.toml", "justfile",
                  "scripts/isolated_rust_tests.py", "codex-rs/.config/nextest.toml",
              ]}
              manifest = {"head": expected, "tree": git("rev-parse", "HEAD^{tree}"), "pins": pins}
              (EVIDENCE / f"{label}-source.json").write_text(json.dumps(manifest, indent=2) + "\n")
              for path in [*IMPLEMENTATION_FILES, TEST_FILE]:
                  shutil.copyfile(SOURCE / path, EVIDENCE / f"{label}-{Path(path).name}")
              return manifest


          def group_rows(pgid):
              result = subprocess.run(["ps", "-eo", "pid=,pgid=,rss="], text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError("owned-group resource observation unavailable")
              rows = []
              for line in result.stdout.splitlines():
                  fields = line.split()
                  if len(fields) == 3 and fields[1] == str(pgid):
                      rows.append({"pid": int(fields[0]), "pgid": int(fields[1]), "rssKiB": int(fields[2])})
              return rows


          def reap_owned_group(proc):
              # Only this newly created group is signalled; never unrelated build processes.
              rows = group_rows(proc.pid)
              if rows:
                  os.killpg(proc.pid, signal.SIGTERM)
                  for _ in range(10):
                      if proc.poll() is not None and not group_rows(proc.pid):
                          break
                      time.sleep(1)
                  if group_rows(proc.pid):
                      os.killpg(proc.pid, signal.SIGKILL)
              proc.wait(timeout=20)
              remaining = group_rows(proc.pid)
              if remaining:
                  raise RuntimeError(f"owned process group did not fully exit: {remaining}")


          def binary_manifest():
              candidates = [path for path in (TARGET / "debug" / "deps").glob("codex_core-*")
                            if path.is_file() and "." not in path.name and os.access(path, os.X_OK)]
              assert len(candidates) == 1, f"expected exactly one core library test binary, found {len(candidates)}"
              return [{"path": str(path), "bytes": path.stat().st_size, "sha256": digest(path)}
                      for path in candidates]


          def guarded_run(argv, log, phase, started, timeout_seconds, env=None):
              assert time.monotonic() - started <= timeout_seconds, "phase deadline before dispatch"
              assert time.monotonic() - STARTED <= 75 * 60, "campaign deadline before dispatch"
              min_free = shutil.disk_usage(TARGET.parent).free
              max_rss = 0
              assert min_free >= 12 * GIB, "insufficient hosted headroom for phase start"
              command = {"argv": argv, "log": str(log)}
              phase["commands"].append(command)
              with log.open("w") as output:
                  proc = subprocess.Popen(argv, cwd=CARGO, stdout=output, stderr=subprocess.STDOUT,
                                          start_new_session=True, env=env)
                  command["ownedPgid"] = proc.pid
                  try:
                      while proc.poll() is None:
                          free = shutil.disk_usage(TARGET.parent).free
                          rss = sum(row["rssKiB"] for row in group_rows(proc.pid)) * 1024
                          min_free, max_rss = min(min_free, free), max(max_rss, rss)
                          reason = None
                          if free < 12 * GIB:
                              reason = "12 GiB early disk stop; 8 GiB hard reserve"
                          elif rss > 12 * GIB:
                              reason = "12 GiB owned-group RSS ceiling"
                          elif sum(Path(item["log"]).stat().st_size for item in phase["commands"]) > 50 * 1024**2:
                              reason = "50 MiB raw-output ceiling"
                          elif time.monotonic() - started > timeout_seconds:
                              reason = "phase deadline"
                          elif time.monotonic() - STARTED > 75 * 60:
                              reason = "campaign deadline"
                          if reason:
                              phase["guardStop"] = reason
                              raise RuntimeError(reason)
                          time.sleep(2)
                      command["exitCode"] = proc.returncode
                  finally:
                      try:
                          reap_owned_group(proc)
                          command["cleanupVerified"] = True
                      finally:
                          command.update(minimumFreeBytes=min_free, maximumOwnedGroupRssBytes=max_rss,
                                         logSha256=digest(log))
                          phase.update(elapsedSeconds=time.monotonic() - started,
                                       minimumFreeBytes=min(item["minimumFreeBytes"] for item in phase["commands"]),
                                       maximumOwnedGroupRssBytes=max(item["maximumOwnedGroupRssBytes"] for item in phase["commands"]),
                                       cleanupVerified=all(item.get("cleanupVerified", False) for item in phase["commands"]))
                          save()
              assert time.monotonic() - started <= timeout_seconds, "phase deadline"
              assert time.monotonic() - STARTED <= 75 * 60, "campaign deadline"
              assert sum(Path(item["log"]).stat().st_size for item in phase["commands"]) <= 50 * 1024**2, "50 MiB raw-output ceiling"
              return command["exitCode"]


          def classifier_inventory(binary, phase, started, timeout_seconds):
              # --list enumerates this exact compiled library without running test bodies.
              # Keep the ordinary wrapper's environment and this phase's owned-group limits.
              spec = importlib.util.spec_from_file_location("isolation", SOURCE / "scripts/isolated_rust_tests.py")
              isolation = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(isolation)
              inventories = {}
              with tempfile.TemporaryDirectory(prefix="issue1573-inventory-") as root:
                  home = Path(root) / "profile"
                  home.mkdir(mode=0o700)
                  scratch = Path(root) / "tmp"
                  scratch.mkdir(mode=0o700)
                  env = isolation.test_environment(dict(os.environ), home)
                  env["TMPDIR"] = str(scratch)
                  for label, extra in (("all", []), ("ignored", ["--ignored"])):
                      log = EVIDENCE / f"{phase['label']}-{label}-inventory.log"
                      code = guarded_run([binary["path"], "--list", "--format", "terse", *extra], log,
                                         phase, started, timeout_seconds, env=env)
                      assert code == 0, f"core library {label} inventory failed"
                      assert digest(Path(binary["path"])) == binary["sha256"], "listed core binary changed"
                      all_names = [line.removesuffix(": test") for line in log.read_text().splitlines() if line.endswith(": test")]
                      names = {name for name in all_names if name.startswith(PREFIX)}
                      assert len(all_names) == len(set(all_names)), "duplicate library inventory"
                      inventories[label] = {"names": sorted(names), "count": len(names), "logSha256": digest(log)}
              all_names = set(inventories["all"]["names"])
              ignored = set(inventories["ignored"]["names"])
              assert ignored == EXPECTED_IGNORED, "ignored classifier inventory differs from the two frozen external-corpus measurements"
              assert ignored <= all_names, "ignored inventory is not a subset of full library inventory"
              names = all_names - ignored
              assert names and NEW_NAMES <= names, "new regression tests absent from ordinary compiled inventory"
              phase["classifierInventory"] = {**inventories, "selectedNames": sorted(names), "selectedCount": len(names),
                                              "ignoredDisposition": "Not run or passed: two explicitly ignored measurements require a separate local corpus."}
              return names


          def execute(label, expected_sha, expect_failure, timeout_seconds):
              expression = f"test(={RED_NAME})" if expect_failure else f"test({PREFIX})"
              argv = [*COMMON_ARGV, "-E", expression]
              phase = {"label": label, "source": snapshot(label, expected_sha), "argv": argv, "commands": []}
              RESULT["phases"].append(phase)
              save()
              log = EVIDENCE / f"{label}.log"
              junit = TARGET / "nextest" / "local" / "junit.xml"
              if junit.exists():
                  junit.unlink()  # Own generated report; earlier report already copied to evidence.
              started = time.monotonic()
              phase["startedUnix"] = time.time()
              print(f"Starting {label}: {expected_sha}", flush=True)
              phase["exitCode"] = guarded_run(argv, log, phase, started, timeout_seconds)
              assert junit.exists(), "no fresh nextest JUnit report; compilation/setup failure"
              report = EVIDENCE / f"{label}-junit.xml"
              shutil.copyfile(junit, report)
              root = ET.parse(report).getroot()
              cases = list(root.iter("testcase"))
              names = {case.get("name") for case in cases}
              assert cases and len(cases) == len(names), "missing or duplicate JUnit cases"
              binaries = binary_manifest()
              phase["binaries"] = binaries
              expected_names = {RED_NAME} if expect_failure else classifier_inventory(binaries[0], phase, started, timeout_seconds)
              selected = [case for case in cases if case.get("name") in expected_names]
              unselected = [case for case in cases if case.get("name") not in expected_names]
              assert {case.get("name") for case in selected} == expected_names, "JUnit omits a selected classifier test"
              for case in unselected:
                  assert case.find("skipped") is not None and case.find("failure") is None and case.find("error") is None, "unexpected unselected test executed"
                  if not expect_failure and case.get("name", "").startswith(PREFIX):
                      assert case.get("name") in EXPECTED_IGNORED, "unaccounted classifier exclusion"
              phase["reportedUnselectedSkippedNames"] = sorted(case.get("name") for case in unselected)
              log_text = log.read_text(errors="replace")
              assert "Skipping test because" not in log_text, "body skip is not qualification"
              assert "Sandbox-dependent test skipped" not in log_text, "body skip is not qualification"
              for case in selected:
                  assert case.find("skipped") is None and case.find("error") is None
                  failures = case.findall("failure")
                  if expect_failure:
                      assert len(failures) == 1, "before-fix regression did not fail"
                      case_text = ET.tostring(case, encoding="unicode")
                      assert ASSERTION in case_text, "before-fix failure did not contain the required regression assertion"
                  else:
                      assert not failures, "fixed classifier test failed"
              assert (phase["exitCode"] != 0) == expect_failure, "unexpected test exit status"
              assert digest(Path(binaries[0]["path"])) == binaries[0]["sha256"], "tested core binary changed"
              phase.update(expectedFailure=expect_failure, selectedBodies=len(selected), retries=0,
                           logSha256=digest(log), junitSha256=digest(report), evidenceAccepted=True)
              snapshot(f"{label}-after", expected_sha)
              save()
              print(f"Verified {label}: {len(selected)} {'expected regression failure' if expect_failure else 'passes'}", flush=True)


          save()
          try:
              assert all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (BASE, RED, CANDIDATE)), "source pins not frozen"
              assert all(re.fullmatch(r"[0-9a-f]{64}", value) for files in HASHES.values() for value in files.values()), "source hashes not frozen"
              assert NEW_NAMES and all(name.startswith(PREFIX) for name in NEW_NAMES), "test names not frozen"
              assert os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "reruns require a newly reviewed changed-method workflow commit"
              assert os.environ.get("CARGO_INCREMENTAL") == "0"
              assert os.environ.get("CARGO_BUILD_JOBS") == "1", "only the admitted one-build-job route is allowed"
              assert "CODEX_SANDBOX_NETWORK_DISABLED" not in os.environ, "inherited network guard would skip bodies; do not override"
              assert "CODEX_SANDBOX" not in os.environ, "unexpected inherited sandbox; preserve and stop"
              for name in ("CORBANU_HOME", "PFTERMINAL_HOME", "CODEX_HOME", "CORBANU_CLASSIFIER_CORPUS", "CORBANU_CLASSIFIER_EVENTS", "OPENAI_API_KEY", "CODEX_API_KEY",
                           "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN", "ZAI_API_KEY"):
                  assert not os.environ.get(name), f"unexpected profile/credential variable {name}; preserve and stop"
              versions = {}
              version_checks = [
                  ("rustc", ["rustc", "--version", "--verbose"], r"(?m)^release: 1\.99\.1$"),
                  ("cargo", ["cargo", "--version"], r"^cargo 1\.99\.1(?: |$)"),
                  ("nextest", ["cargo", "nextest", "--version"], r"^cargo-nextest 0\.9\.103(?: |$)"),
                  ("just", ["just", "--version"], r"^just 1\.51\.0(?: |$)"),
              ]
              for name, command, expected_version in version_checks:
                  output = subprocess.check_output(command, cwd=CARGO, text=True, stderr=subprocess.STDOUT)
                  versions[name] = {"argv": command, "output": output}
                  (EVIDENCE / "installed-tool-versions.json").write_text(json.dumps(versions, indent=2) + "\n")
                  assert re.search(expected_version, output), f"unexpected installed {name} version"
              RESULT["installedVersions"] = versions
              save()
              assert not TARGET.exists(), "qualification requires a fresh dedicated target"
              assert shutil.disk_usage(TARGET.parent).free >= 30 * GIB, "hosted launch requires 30 GiB free"
              assert git("rev-parse", "HEAD") == CANDIDATE
              assert git("rev-parse", "HEAD^") == RED
              assert git("rev-parse", "HEAD^^") == BASE
              assert git("diff", "--name-only", BASE, RED).splitlines() == [TEST_FILE], "before-fix commit must only add regression tests"
              assert git("diff", "--name-only", RED, CANDIDATE).splitlines() == sorted(IMPLEMENTATION_FILES), "fixed commit scope changed"
              assert git("diff", "--name-only", BASE, CANDIDATE).splitlines() == sorted([*IMPLEMENTATION_FILES, TEST_FILE])
              assert HASHES[RED][TEST_FILE] == HASHES[CANDIDATE][TEST_FILE], "regression test changed between red and green"
              for path in IMPLEMENTATION_FILES:
                  assert git("rev-parse", f"{BASE}:{path}") == git("rev-parse", f"{RED}:{path}"), f"before-fix implementation changed: {path}"
              for path in ("scripts/isolated_rust_tests.py", "justfile", "codex-rs/.config/nextest.toml"):
                  assert git("rev-parse", f"{BASE}:{path}") == git("rev-parse", f"{CANDIDATE}:{path}"), f"test controls changed: {path}"
              (EVIDENCE / "before-fix-tests.patch").write_text(git("diff", BASE, RED, "--", TEST_FILE) + "\n")
              (EVIDENCE / "fix.patch").write_text(git("diff", RED, CANDIDATE) + "\n")
              for sha in (RED, CANDIDATE):
                  assert git("show", "-s", "--format=%an <%ae>", sha) == DCO_IDENTITY, "unexpected source author"
                  assert f"Signed-off-by: {DCO_IDENTITY}" in git("show", "-s", "--format=%B", sha).splitlines(), "source commit lacks author's DCO"
                  (EVIDENCE / f"commit-{sha}.txt").write_text(git("show", "-s", "--format=fuller", sha) + "\n")
              subprocess.run(["git", "checkout", "--detach", RED], cwd=SOURCE, check=True)
              execute("before-fix-red", RED, True, 45 * 60)
              subprocess.run(["git", "checkout", "--detach", CANDIDATE], cwd=SOURCE, check=True)
              execute("fixed-classifier-green", CANDIDATE, False, 15 * 60)
              RESULT["qualified"] = True
          except BaseException as error:
              RESULT["failure"] = f"{type(error).__name__}: {error}"
              raise
          finally:
              restored = subprocess.run(["git", "checkout", "--detach", CANDIDATE], cwd=SOURCE)
              if restored.returncode == 0:
                  try:
                      snapshot("restored", CANDIDATE)
                      RESULT["restoredCandidate"] = True
                  except BaseException as error:
                      RESULT["restorationFailure"] = f"{type(error).__name__}: {error}"
              RESULT["qualified"] = RESULT["qualified"] and RESULT["restoredCandidate"]
              RESULT["elapsedSeconds"] = time.monotonic() - STARTED
              RESULT["finalFreeBytes"] = shutil.disk_usage(TARGET.parent).free
              save()
              print(json.dumps({key: RESULT.get(key) for key in ("qualified", "restoredCandidate", "failure")}))
              if not RESULT["qualified"]:
                  raise SystemExit(1)
          PY
      - name: Preserve source linkage and raw qualification records
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: issue1573-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
